<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CarCloudSPY{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-radar"></i> CarCloudSPY
        </a>
        <span class="navbar-text text-light small">
            <i class="bi bi-geo-alt"></i> San Carlos de Bariloche
        </span>
        <div class="ms-auto d-flex gap-2">
            <a href="/" class="btn btn-sm btn-outline-light">
                <i class="bi bi-list-ul"></i> Por horizonte
            </a>
            <a href="/comparativo" class="btn btn-sm btn-outline-light">
                <i class="bi bi-bar-chart-line"></i> Por agencia
            </a>
            <a href="/buckets" class="btn btn-sm btn-outline-light">
                <i class="bi bi-grid-3x3-gap"></i> Por categoría
            </a>
            <a href="/matriz" class="btn btn-sm btn-outline-light">
                <i class="bi bi-table"></i> Matriz
            </a>
            <a href="/promos" class="btn btn-sm btn-outline-light">
                <i class="bi bi-megaphone"></i> Promos
            </a>
            <button class="btn btn-sm btn-outline-light" id="btn-refresh">
                <i class="bi bi-arrow-clockwise"></i> Refrescar ahora
            </button>
        </div>
    </div>
</nav>
<main class="container-fluid pb-5">
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/static/js/app.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
